name: Bootstrap and validate AI Bridge

on:
  push:
    branches:
      - validate-ai-bridge
    paths:
      - '.bootstrap/part12'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Rebuild exact plugin package
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part{00..12} > plugin.zip
          echo "007fca86468feebcf5caf2d155a2e62dbcbd5248996f39a1eaedfe61572e2ba7  plugin.zip" | sha256sum -c -
          rm -rf /tmp/ai-bridge
          mkdir -p /tmp/ai-bridge
          unzip -q plugin.zip -d /tmp/ai-bridge
          test -f /tmp/ai-bridge/ai_bridge/version.php

      - name: Validate with moodle-plugin-validate
        uses: EduardoKrausME/moodle-plugin-validate@main
        with:
          plugin: /tmp/ai-bridge/ai_bridge

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find /tmp/ai-bridge/ai_bridge -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Publish validated source on validation branch
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' /tmp/ai-bridge/ai_bridge/ ./
          rm -f plugin.zip
          git config user.name "Eduardo Kraus"
          git config user.email "kraus@eduardokraus.com"
          git add -A
          git commit -m "Add local_ai_bridge with Claude provider"
          git push origin HEAD:validate-ai-bridge
